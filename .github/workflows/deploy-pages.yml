name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.60 does not support yet.
    # Bump together with @playwright/test once a version supports the newer image.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check lint
        run: npm run lint

      - name: Check types
        run: npx tsc -b

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browser
        # GitHub runners already have the libraries Chromium needs: no apt download
        # (apt mirrors were unreachable on 2026-11-11 and blocked every deploy)
        run: npx playwright install chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build for GitHub Pages
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
